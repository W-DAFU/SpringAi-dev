spring:
  application:
    name: SpringAi-Tool


  ai:
    openai:
      # 从环境变量读取真实 API Key，避免把密钥写死在代码仓库里。
      api-key: ${SILICONFLOW_API_KEY}
      # 硅基流动兼容 OpenAI 协议，base-url 写到 /v1 即可。
      base-url: https://api.siliconflow.cn/v1
      # 外部模型接口异常或网络慢时，最多等待 10 秒，避免 HTTP 请求长时间挂起。
      timeout: 50s
      # 降低重试次数，学习案例里失败能更快暴露。
      max-retries: 1
      chat:
        # 聊天模型名称，需要使用服务商支持的 OpenAI 兼容模型。
        model: deepseek-ai/DeepSeek-V4-Flash
